name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # Source-building the isolated video codec closure is distinct from the
    # processor's two-hour media-operation deadline. Individual video build and
    # fixture commands below retain tighter timeout(1) boundaries.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nmcp
          POSTGRES_PASSWORD: nmcp-test-password
          POSTGRES_DB: nmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmcp -d nmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://nmcp:nmcp-test-password@127.0.0.1:5432/nmcp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Provision stable PostgreSQL runtime roles
        run: >-
          psql "$TEST_DATABASE_URL" --set ON_ERROR_STOP=1
          --set nmcp_migrator_role=nmcp
          --file infra/postgresql/runtime-roles.sql
      - name: Explicit administrative CLI PostgreSQL integration evidence
        run: |
          gofmt -d cmd/nmcp-admin internal/admin internal/job/repository.go internal/renditioncleanup/runner.go
          go test -v -count=1 ./internal/admin ./cmd/nmcp-admin
      - name: Restore content-addressed fixture archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/downloads/ffmpeg-6.0.1-amd64-static-28268bf402f1083833ea269331587f60a242848880073be8016501d864bd07a5.tar.xz
          key: fixture-ffmpeg-linux-amd64-28268bf402f1083833ea269331587f60a242848880073be8016501d864bd07a5
      - name: Test bounded pinned acquisition
        run: python3 scripts/test-fetch-pinned-ffmpeg
      - name: Install metadata probe tools
        run: |
          mkdir -p .tools
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux xz-utils
          curl --fail --location --silent --show-error \
            https://github.com/exiftool/exiftool/archive/refs/tags/13.36.tar.gz \
            --output .tools/exiftool-13.36.tar.gz
          python3 scripts/fetch-pinned-ffmpeg
          printf '%s  %s\n' \
            f70ecbcdccc18268d4d3c290faf8cf73b1cf128e3e7f8671e24d6604cae4dc73 .tools/exiftool-13.36.tar.gz | sha256sum --check
          tar -xzf .tools/exiftool-13.36.tar.gz -C .tools
          tar -xJf .tools/ffmpeg-6.0.1-amd64-static.tar.xz -C .tools
          .tools/exiftool-13.36/exiftool -ver
          .tools/ffmpeg-6.0.1-amd64-static/ffprobe -version
          prlimit --version
      - name: Validate inherited video toolchain rejection checks
        run: |
          timeout 1m internal/videoprocessor/helper/validate-inherited-toolchain_test.sh
          timeout 1m bash internal/videoprocessor/helper/acquisition_test.sh
      - name: Build native still-image helper smoke target
        run: |
          sudo apt-get install -y --no-install-recommends \
            autoconf automake cmake libtool make meson nasm ninja-build pkg-config \
            libglib2.0-dev libjpeg-turbo8-dev libpng-dev libwebp-dev libexif-dev \
            libde265-dev zlib1g-dev
          curl --fail --location --silent --show-error \
            https://registry.color.org/rgb-registry/profiles/sRGB2014.icc \
            --output "${RUNNER_TEMP}/sRGB2014.icc"
          printf '%s  %s\n' \
            384b832de3412066743b52a75ee906b6fb9fb8d9e09e936fc2c43223815c6e0a \
            "${RUNNER_TEMP}/sRGB2014.icc" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://www.gstatic.com/webp/gallery/4.webp \
            --output "${RUNNER_TEMP}/static-gallery-4.webp"
          printf '%s  %s\n' \
            0858d0afcb2921ded36b05586204f2459d965feb7db54cb083e3cfa059589dd9 \
            "${RUNNER_TEMP}/static-gallery-4.webp" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/recurser/exif-orientation-examples/219294e144531b0c01247913cb58b6f5531b5081/Landscape_6.jpg \
            --output "${RUNNER_TEMP}/orientation-6.jpg"
          printf '%s  %s\n' \
            9b344e9f0c869d8637ea22e672df9451d8d3cc1d2d0b291af3b284e538e5f124 \
            "${RUNNER_TEMP}/orientation-6.jpg" | sha256sum --check
          curl --fail --location --silent --show-error \
            'https://raw.pixls.us/data/Canon/Canon%20PowerShot%20A410/CANON_A410_CHDK_CRW_0741.DNG' \
            --output "${RUNNER_TEMP}/canon-a410.dng"
          printf '%s  %s\n' \
            f0d2fe47507fadf50008bddbc6bd2c5e39fddbe90cca6bca72dd360fa0e0eb38 \
            "${RUNNER_TEMP}/canon-a410.dng" | sha256sum --check
          chmod +x internal/stillprocessor/helper/build-pinned-toolchain.sh
          internal/stillprocessor/helper/build-pinned-toolchain.sh \
            "${RUNNER_TEMP}/still-toolchain" "${RUNNER_TEMP}/still-toolchain-work"
          heic_fixture="${RUNNER_TEMP}/still-toolchain-work/source/libheif-1.23.5/examples/example.heic"
          printf '%s  %s\n' \
            7f8b363e4936c0666a25f64f3a92fda10bd8e5453be4592530b65a55dd98f3f2 \
            "${heic_fixture}" | sha256sum --check
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/still-toolchain/lib/pkgconfig:${RUNNER_TEMP}/still-toolchain/lib64/pkgconfig"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64"
          cmake -S internal/stillprocessor/helper \
            -B "${RUNNER_TEMP}/still-helper-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/still-toolchain"
          cmake --build "${RUNNER_TEMP}/still-helper-build" --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/still-helper-build" --output-on-failure
          "${RUNNER_TEMP}/still-helper-build/bin/nmcp-heif-fixture-generator" \
            "${RUNNER_TEMP}/generated-heif-fixtures" "${RUNNER_TEMP}/sRGB2014.icc"
          capabilities=$("${RUNNER_TEMP}/still-helper-build/bin/nmcp-still-helper" \
            capabilities --protocol 1 --threads 1 \
            --srgb-icc "${RUNNER_TEMP}/sRGB2014.icc")
          printf '%s\n' "${capabilities}"
          CAPABILITIES="${capabilities}" python3 -c \
            'import json,os; v=json.loads(os.environ["CAPABILITIES"])["result"]["library_versions"]; assert v["libvips"]=="8.18.7" and v["libheif"]=="1.23.5" and v["libraw"]=="0.22.2-Release" and v["libaom"]=="v3.8.2" and v["lcms2"]=="2.14", v'
          printf 'TEST_STILL_HELPER_PATH=%s\nTEST_STILL_RAW_REFERENCE_PATH=%s\nTEST_STILL_AVIF_REFERENCE_PATH=%s\nTEST_STILL_ICC_PATH=%s\nTEST_STILL_P3_ICC_PATH=%s\nTEST_STILL_HEIC_PATH=%s\nTEST_STILL_WEBP_PATH=%s\nTEST_STILL_ORIENTATION6_PATH=%s\nTEST_STILL_RAW_PATH=%s\nTEST_STILL_PQ_PATH=%s\nTEST_STILL_HLG_PATH=%s\nTEST_STILL_ICC_NCLX_PATH=%s\nTEST_STILL_INVALID_ICC_PATH=%s\nTEST_STILL_HEIF_COLLECTION_PATH=%s\n' \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-still-helper" \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-raw-reference" \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-avif-reference" \
            "${RUNNER_TEMP}/sRGB2014.icc" \
            "${RUNNER_TEMP}/generated-heif-fixtures/display-p3.icc" "${heic_fixture}" \
            "${RUNNER_TEMP}/static-gallery-4.webp" \
            "${RUNNER_TEMP}/orientation-6.jpg" \
            "${RUNNER_TEMP}/canon-a410.dng" \
            "${RUNNER_TEMP}/generated-heif-fixtures/pq.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/hlg.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/icc-nclx.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/invalid-icc.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/collection-primary-second.avif" >> "${GITHUB_ENV}"
          printf 'LD_LIBRARY_PATH=%s\n' \
            "${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64" >> "${GITHUB_ENV}"
      - name: Build pinned native animation helper and fixtures
        run: |
          chmod +x internal/animationprocessor/helper/build-pinned-codecs.sh
          internal/animationprocessor/helper/build-pinned-codecs.sh \
            "${RUNNER_TEMP}/still-toolchain" "${RUNNER_TEMP}/animation-toolchain-work"
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/still-toolchain/lib/pkgconfig:${RUNNER_TEMP}/still-toolchain/lib64/pkgconfig"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64"
          cmake -S internal/animationprocessor/helper \
            -B "${RUNNER_TEMP}/animation-helper-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNMCP_PINNED_PREFIX="${RUNNER_TEMP}/still-toolchain"
          cmake --build "${RUNNER_TEMP}/animation-helper-build" --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/animation-helper-build" --output-on-failure
          "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-fixture-generator" \
            "${RUNNER_TEMP}/animation-variable.webp"
          "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-gif-fixture-generator" \
            "${RUNNER_TEMP}/animation-gif-fixtures"
          capabilities=$("${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-helper" \
            capabilities --protocol 1 --threads 1 \
            --srgb-icc /proc/self/fd/3 3<"${RUNNER_TEMP}/sRGB2014.icc")
          printf '%s\n' "${capabilities}"
          CAPABILITIES="${capabilities}" python3 -c \
            'import json,os; r=json.loads(os.environ["CAPABILITIES"])["result"]; v=r["library_versions"]; assert v["libwebp"]==v["libwebp-demux"]==v["libwebp-mux"]=="1.6.0" and v["giflib"]=="5.2.2" and v["libheif"]=="1.23.5" and v["libaom"]=="v3.8.2" and v["lcms2"]=="2.14" and r["build_manifest"]=="giflib=5.2.2;libwebp=1.6.0;simd=on;threads=on;near-lossless=on", r'
          printf 'TEST_ANIMATION_HELPER_PATH=%s\nTEST_ANIMATION_WEBP_PATH=%s\nTEST_ANIMATION_WEBP_REFERENCE_PATH=%s\nTEST_ANIMATION_GIF_BACKGROUND_PATH=%s\nTEST_ANIMATION_GIF_PREVIOUS_PATH=%s\nTEST_ANIMATION_GIF_INCOMPRESSIBLE_SINGLE_PATH=%s\nTEST_ANIMATION_GIF_INCOMPRESSIBLE_MANY_PATH=%s\n' \
            "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-helper" \
            "${RUNNER_TEMP}/animation-variable.webp" \
            "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-webp-reference" \
            "${RUNNER_TEMP}/animation-gif-fixtures/dispose-background.gif" \
            "${RUNNER_TEMP}/animation-gif-fixtures/dispose-previous.gif" \
            "${RUNNER_TEMP}/animation-gif-fixtures/incompressible-single.gif" \
             "${RUNNER_TEMP}/animation-gif-fixtures/incompressible-many.gif" >> "${GITHUB_ENV}"
      - name: Build isolated pinned video toolchain and fixtures
        run: |
          timeout 20m internal/videoprocessor/helper/build-pinned-toolchain.sh \
            "${RUNNER_TEMP}/still-toolchain" "${RUNNER_TEMP}/video-toolchain-work"
          timeout 2m go build -o "${RUNNER_TEMP}/still-toolchain/bin/nmcp-video-helper" \
            ./cmd/nmcp-video-helper
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64"
          video_helper="${RUNNER_TEMP}/still-toolchain/bin/nmcp-video-helper"
          capabilities=$(timeout 1m "${video_helper}" capabilities --protocol 1 --threads 1 \
            --srgb-icc /proc/self/fd/3 3<"${RUNNER_TEMP}/sRGB2014.icc")
          printf '%s\n' "${capabilities}"
          CAPABILITIES="${capabilities}" python3 -c \
            'import json,os; r=json.loads(os.environ["CAPABILITIES"])["result"]; v=r["library_versions"]; assert v=={"ffmpeg":"9.0.2","libsvtav1":"4.2.0","zimg":"3.0.6","libaom":"v3.8.2"} and r["video_encoder"]=="libsvtav1" and r["audio_encoder"]=="aac-lc" and r["tone_map"]=="zscale+hable" and r["build_manifest"]=="ffmpeg=9.0.2;svt-av1=4.2.0;zimg=3.0.6;libaom=v3.8.2;threads=1", r'
          ldd "${RUNNER_TEMP}/still-toolchain/bin/ffmpeg" | tee "${RUNNER_TEMP}/video-ffmpeg-ldd.txt"
          python3 - "${RUNNER_TEMP}/video-ffmpeg-ldd.txt" "${RUNNER_TEMP}/still-toolchain" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          prefix=sys.argv[2]
          for library in ("libSvtAv1Enc", "libzimg", "libaom"):
              line=next((line for line in text.splitlines() if library in line), None)
              assert line and prefix in line, (library,line,text)
          PY
          generator="${GITHUB_WORKSPACE}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg"
          timeout 1m "${generator}" -version
          timeout 1m "${generator}" -buildconf
          timeout 1m "${generator}" -hide_banner -encoders 2>&1 | grep -E 'libx264|libx265'
          timeout 1m "${generator}" -hide_banner -decoders 2>&1 | grep -E ' av1| aac'
          fixtures="${RUNNER_TEMP}/video-fixtures"
          mkdir -p "${fixtures}"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc=size=321x181:rate=25:duration=0.16' \
            -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=0.16' -shortest \
            -c:v libx264 -preset ultrafast -pix_fmt yuv444p -color_primaries bt709 \
            -color_trc bt709 -colorspace bt709 -color_range tv -c:a aac -b:a 96k \
            "${fixtures}/avc-odd-audio.mp4"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=128x96:rate=25:duration=0.16' -an \
            -c:v libx265 -preset ultrafast -x265-params pools=1:frame-threads=1 \
            -pix_fmt yuv420p -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv \
            "${fixtures}/hevc-base.mp4"
          timeout 1m "${generator}" -v error -y -i "${fixtures}/hevc-base.mp4" -map 0 -c copy \
            -metadata:s:v:0 rotate=90 "${fixtures}/hevc-rotated.mov"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=320x180:rate=25:duration=0.16' -an \
            -vf format=yuv420p10le -c:v libx265 -preset ultrafast \
            -x265-params 'pools=1:frame-threads=1:keyint=1:min-keyint=1:repeat-headers=1:hdr10=1:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400' \
            -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -color_range tv \
            "${fixtures}/hevc-pq.mp4"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=320x180:rate=25:duration=0.04' -frames:v 1 -an \
            -vf format=yuv420p10le -c:v libx265 -preset ultrafast -f hevc \
            -x265-params 'pools=1:frame-threads=1:keyint=1:min-keyint=1:bframes=0:hdr10=1:master-display=G(13250,34500)B(7500,3000)R(34000,16000)WP(15635,16450)L(10000000,1):max-cll=1000,400' \
            -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -color_range tv \
            "${fixtures}/pq-first.hevc"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=320x180:rate=25:duration=0.12' -frames:v 3 -an \
            -vf format=yuv420p10le -c:v libx265 -preset ultrafast -f hevc \
            -x265-params 'pools=1:frame-threads=1:keyint=1:min-keyint=1:bframes=0' \
            -color_primaries bt2020 -color_trc smpte2084 -colorspace bt2020nc -color_range tv \
            "${fixtures}/pq-later.hevc"
          cat "${fixtures}/pq-first.hevc" "${fixtures}/pq-later.hevc" > "${fixtures}/pq-missing-combined.hevc"
          timeout 1m "${generator}" -v error -y -r 25 -i "${fixtures}/pq-missing-combined.hevc" \
            -map 0:v:0 -c:v copy -tag:v hvc1 "${fixtures}/hevc-pq-later-missing.mp4"
          rm "${fixtures}/pq-first.hevc" "${fixtures}/pq-later.hevc" "${fixtures}/pq-missing-combined.hevc"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=320x180:rate=25:duration=0.16' -an \
            -vf format=yuv420p10le -c:v libx265 -preset ultrafast \
            -x265-params 'pools=1:frame-threads=1' -color_primaries bt2020 \
            -color_trc arib-std-b67 -colorspace bt2020nc -color_range tv \
            "${fixtures}/hevc-hlg.mp4"
          timeout 1m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'color=red:size=96x64' -frames:v 1 "${fixtures}/cover.jpg"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'color=blue:size=64x48:rate=25:duration=0.16' \
            -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=0.16' \
            -f lavfi -i 'sine=frequency=880:sample_rate=48000:duration=0.16' \
            -map 0:v -map 1:a -map 2:a -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv \
            -c:a aac -shortest -disposition:v:0 default -disposition:a:0 0 \
            -disposition:a:1 default "${fixtures}/multistream-base.mp4"
          timeout 1m "${generator}" -v error -y -i "${fixtures}/multistream-base.mp4" \
            -i "${fixtures}/cover.jpg" -map 0 -map 1:v -c copy -disposition:v:1 attached_pic \
            "${fixtures}/multistream.mp4"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc=size=96x54:rate=25:duration=0.16' \
            -f lavfi -i 'testsrc2=size=120x80:rate=25:duration=0.16' \
            -map 0:v -map 1:v -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 -color_range tv \
            -disposition:v:0 0 -disposition:v:1 default \
            "${fixtures}/multistream-rotated-base.mp4"
          timeout 1m "${generator}" -v error -y -i "${fixtures}/multistream-rotated-base.mp4" \
            -i "${fixtures}/cover.jpg" -map 0:v:0 -map 0:v:1 -map 1:v -c copy \
            -disposition:v:0 0 -disposition:v:1 default -disposition:v:2 attached_pic \
            -metadata:s:v:1 rotate=90 "${fixtures}/multistream-rotated.mp4"
          rm "${fixtures}/multistream-base.mp4" "${fixtures}/multistream-rotated-base.mp4" \
            "${fixtures}/cover.jpg"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc2=size=80x50:rate=25:duration=0.16' \
            -f lavfi -i 'sine=frequency=660:sample_rate=192000:duration=0.16' -shortest \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -color_primaries bt709 \
            -color_trc bt709 -colorspace bt709 -color_range tv -c:a pcm_s16le \
            "${fixtures}/audio-resample.mov"
          timeout 2m "${generator}" -v error -y -threads 1 \
            -f lavfi -i 'testsrc=size=160x90:rate=25:duration=0.2' -frames:v 4 \
            -vf 'setpts=if(gte(N\,2)\,N+1\,N)/(25*TB),setsar=2/1' -fps_mode vfr -an -c:v libx264 \
            -preset ultrafast -pix_fmt yuv420p -color_primaries bt709 -color_trc bt709 \
            -colorspace bt709 -color_range tv "${fixtures}/vfr-sar.mp4"
          for fixture in "${fixtures}"/*.mp4 "${fixtures}"/*.mov; do
            sha256sum "${fixture}"
            timeout 1m "${GITHUB_WORKSPACE}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe" \
              -v error -show_streams -show_format "${fixture}"
            timeout 1m "${generator}" -v error -xerror -i "${fixture}" -f null -
            timeout 1m "${generator}" -v error -i "${fixture}" -map 0:v -f framehash -
          done
          printf 'TEST_VIDEO_HELPER_PATH=%s\nTEST_VIDEO_PRLIMIT_PATH=%s\nTEST_VIDEO_ICC_PATH=%s\nTEST_VIDEO_AVC_PATH=%s\nTEST_VIDEO_HEVC_ROTATED_PATH=%s\nTEST_VIDEO_PQ_PATH=%s\nTEST_VIDEO_PQ_LATER_MISSING_PATH=%s\nTEST_VIDEO_HLG_PATH=%s\nTEST_VIDEO_MULTISTREAM_PATH=%s\nTEST_VIDEO_MULTISTREAM_ROTATED_PATH=%s\nTEST_VIDEO_VFR_PATH=%s\nTEST_VIDEO_RESAMPLE_PATH=%s\n' \
            "${video_helper}" "$(command -v prlimit)" "${RUNNER_TEMP}/sRGB2014.icc" \
            "${fixtures}/avc-odd-audio.mp4" "${fixtures}/hevc-rotated.mov" \
            "${fixtures}/hevc-pq.mp4" "${fixtures}/hevc-pq-later-missing.mp4" "${fixtures}/hevc-hlg.mp4" \
            "${fixtures}/multistream.mp4" "${fixtures}/multistream-rotated.mp4" \
            "${fixtures}/vfr-sar.mp4" \
            "${fixtures}/audio-resample.mov" >> "${GITHUB_ENV}"
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build all three Core binaries
        run: go build ./cmd/core-api ./cmd/core-worker ./cmd/nmcp-admin
      - name: Unit and local integration tests
        # Package test binaries share one PostgreSQL service. Run them serially
        # so their isolated-schema setup/teardown cannot deadlock on the
        # intentionally database-wide migration advisory lock and PG catalogs.
        run: go test -p 1 -count=1 ./...
      - name: Explicit profile schema and bundled recipe evidence
        run: go test -v -count=1 ./internal/profile
      - name: Explicit metadata detector and real probe evidence
        env:
          TEST_METADATA_TOOLS: "1"
          TEST_EXIFTOOL_PATH: ${{ github.workspace }}/.tools/exiftool-13.36/exiftool
          TEST_FFPROBE_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe
          TEST_FFMPEG_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg
        run: go test -v -count=1 ./internal/mediaformat ./internal/metadata
      - name: Explicit native still codec evidence
        env:
          TEST_STILL_HELPER: "1"
          TEST_FFPROBE_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe
          TEST_FFMPEG_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg
        run: go test -v -count=1 ./internal/stillprocessor
      - name: Explicit native animation codec evidence
        env:
          TEST_ANIMATION_HELPER: "1"
        run: go test -v -count=1 ./internal/animationprocessor
      - name: Explicit native video codec evidence
        env:
          TEST_VIDEO_HELPER: "1"
          TEST_FFPROBE_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe
          TEST_FFMPEG_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg
        run: timeout 10m go test -v -count=1 -run '^TestVideoHelperRealCodecMatrix$' ./internal/videoprocessor
      - name: Explicit Linux storage durability evidence
        run: go test -v -count=1 ./internal/storage
      - name: Race tests
        run: go test -p 1 -race -count=1 ./...
      - name: Explicit PostgreSQL migration integration evidence
        run: go test -v -count=1 -run '^TestMigratorIntegration$' ./internal/database
      - name: Explicit job lease, Worker, and process supervision evidence
        run: go test -v -count=1 ./internal/job ./internal/worker ./internal/processrunner
      - name: Explicit upload PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestRepositoryIntegration' ./internal/upload
      - name: Explicit read PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestReadServiceIntegration$' ./internal/readapi
      - name: Explicit read HTTP and PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestReadHTTPPostgreSQLIntegration$' ./internal/httpapi
      - name: Explicit lifecycle PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestLifecycleRepositoryIntegration' ./internal/medialifecycle
      - name: Explicit lifecycle HTTP and PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestLifecycleHTTPPostgreSQLIntegration$' ./internal/httpapi
      - name: Preserve exact-head native closure for live backup cutover
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup-live-binaries"
          go build -o "$RUNNER_TEMP/backup-live-binaries/core-api" ./cmd/core-api
          go build -o "$RUNNER_TEMP/backup-live-binaries/core-worker" ./cmd/core-worker
          go build -o "$RUNNER_TEMP/backup-live-binaries/nmcp-admin" ./cmd/nmcp-admin
          printf '%s\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/native-build-prefix.txt"
          tar -czf "$RUNNER_TEMP/backup-native-closure.tar.gz" -C "$RUNNER_TEMP" \
            still-toolchain still-helper-build/bin/nmcp-still-helper \
            animation-helper-build/bin/nmcp-animation-helper sRGB2014.icc \
            orientation-6.jpg backup-live-binaries native-build-prefix.txt
      - name: Publish exact-head native closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-native-${{ github.sha }}
          path: ${{ runner.temp }}/backup-native-closure.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failed probe acquisition identity
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-acquisition-${{ github.sha }}-${{ github.run_attempt }}
          path: .tools/probe-download-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  backup-postgresql17:
    name: Backup / PostgreSQL 17 production roles and operator restore
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Build pinned PostgreSQL 17 server and clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison flex make gcc zlib1g-dev postgresql-common util-linux
          mkdir -p "$RUNNER_TEMP/backup-pg17"
          curl --fail --location --silent --show-error \
            https://ftp.postgresql.org/pub/source/v17.7/postgresql-17.7.tar.bz2 \
            --output "$RUNNER_TEMP/backup-pg17/source.tar.bz2"
          printf '%s  %s\n' \
            ef9e343302eccd33112f1b2f0247be493cb5768313adeb558b02de8797a2e9b5 \
            "$RUNNER_TEMP/backup-pg17/source.tar.bz2" | sha256sum --check
          tar -xjf "$RUNNER_TEMP/backup-pg17/source.tar.bz2" -C "$RUNNER_TEMP/backup-pg17"
          cd "$RUNNER_TEMP/backup-pg17/postgresql-17.7"
          test ! -e /opt/nmcp-pg17-ci
          ./configure --prefix=/opt/nmcp-pg17-ci --without-readline --without-icu
          make -j2
          sudo make -j2 install
          /opt/nmcp-pg17-ci/bin/postgres --version | grep -F '17.7'
          /opt/nmcp-pg17-ci/bin/pg_dump --version | grep -F '17.7'
          /opt/nmcp-pg17-ci/bin/pg_restore --version | grep -F '17.7'
          # Fresh standard root-owned tool installation, not permissions relaxed
          # on runner homes. initdb validates read+execute access after setpriv.
          namei -l /opt/nmcp-pg17-ci/bin/initdb
          for tool in postgres initdb pg_ctl psql pg_dump pg_restore; do
            sudo setpriv --reuid=postgres --regid=postgres --init-groups /usr/bin/test -r "/opt/nmcp-pg17-ci/bin/$tool"
            sudo setpriv --reuid=postgres --regid=postgres --init-groups /usr/bin/test -x "/opt/nmcp-pg17-ci/bin/$tool"
          done
      - name: Provision isolated runtime and backup UIDs
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "${GITHUB_WORKSPACE:?}")
          config=$(realpath -e -- "$workspace/infra/ubuntu/sysusers.d/nmcp.conf")
          test "$config" = "$workspace/infra/ubuntu/sysusers.d/nmcp.conf"
          test -f "$config" && test ! -L "$config"
          sudo systemd-sysusers "$config"
          python3 - <<'PYUID'
          import grp, os, pwd
          runtime, backup, postgres = [pwd.getpwnam(name) for name in ('nmcp', 'nmcp-backup', 'postgres')]
          assert len({runtime.pw_uid, backup.pw_uid, postgres.pw_uid, 0}) == 4
          assert len({runtime.pw_gid, backup.pw_gid, postgres.pw_gid, 0}) == 4
          for user in (runtime, backup):
              assert user.pw_gid != 0 and grp.getgrgid(user.pw_gid).gr_name == user.pw_name
              assert user.pw_dir == '/var/lib/' + user.pw_name
              assert user.pw_shell == '/usr/sbin/nologin'
              assert set(os.getgrouplist(user.pw_name, user.pw_gid)) == {user.pw_gid}
              print(f'Isolated UID verified: {user.pw_name} uid={user.pw_uid} gid={user.pw_gid}')
          PYUID
      - name: Build exact candidate backup acceptance test binary
        run: |
          go test -c -o "$RUNNER_TEMP/backup17.test" ./internal/admin
          "$RUNNER_TEMP/backup17.test" -test.list '^TestBackupPG17' | grep -Fx TestBackupPG17ProductionRoles
          "$RUNNER_TEMP/backup17.test" -test.list '^TestBackupPG17' | grep -Fx TestBackupPG17OperatorRestore
      - name: Actual multiowner dump and operator restore acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo env -i PATH=/usr/bin:/bin HOME=/root LC_ALL=C \
            TEST_BACKUP_PG17_BINDIR=/opt/nmcp-pg17-ci/bin \
            "$RUNNER_TEMP/backup17.test" -test.v -test.count=1 -test.timeout=10m \
            -test.run '^(TestBackupPG17(ProductionRoles|OperatorRestore|LifecycleMigration|AuthorityLossDuringRealDump|RetentionPolicySerialization|SourceOnlyHBA)|TestRestoreConnectionPG17Pinned)$' | tee "$RUNNER_TEMP/backup-pg17-acceptance.log"
          grep -F -- '--- PASS: TestBackupPG17ProductionRoles ' "$RUNNER_TEMP/backup-pg17-acceptance.log"
          grep -F -- '--- PASS: TestBackupPG17OperatorRestore ' "$RUNNER_TEMP/backup-pg17-acceptance.log"
          ! grep -F -- '--- SKIP: TestBackupPG17' "$RUNNER_TEMP/backup-pg17-acceptance.log"
          for name in TestBackupPG17AuthorityLossDuringRealDump TestBackupPG17RetentionPolicySerialization TestBackupPG17SourceOnlyHBA TestRestoreConnectionPG17Pinned; do
            grep -F -- "--- PASS: $name " "$RUNNER_TEMP/backup-pg17-acceptance.log"
          done
          ! grep -F -- '--- SKIP: TestRestoreConnectionPG17Pinned' "$RUNNER_TEMP/backup-pg17-acceptance.log"
      - name: Preserve exact-head PostgreSQL17 closure
        run: tar -czf "$RUNNER_TEMP/backup-pg17-closure.tar.gz" -C /opt nmcp-pg17-ci
      - name: Publish exact-head PostgreSQL17 closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backup-postgresql17-${{ github.sha }}
          path: ${{ runner.temp }}/backup-pg17-closure.tar.gz
          if-no-files-found: error
          retention-days: 1
  backup-live-cutover:
    name: Backup / actual systemd all-pool cutover and separate resume
    needs: [test, backup-postgresql17]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install isolated systemd machine provisioner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends debootstrap systemd-container util-linux
          bash -n scripts/run-backup-root-isolated
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-run-backup-root-isolated
      - name: Receive exact-head native closure
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backup-native-${{ github.sha }}
          path: ${{ runner.temp }}/backup-live-inputs
      - name: Receive exact-head PostgreSQL17 closure
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backup-postgresql17-${{ github.sha }}
          path: ${{ runner.temp }}/backup-live-inputs
      - name: Restore authenticated current-run build products
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/backup-live-inputs/backup-native-closure.tar.gz" -C "$RUNNER_TEMP"
          test ! -e /opt/nmcp-pg17-ci
          sudo tar -xzf "$RUNNER_TEMP/backup-live-inputs/backup-pg17-closure.tar.gz" -C /opt
          test "$(cat "$RUNNER_TEMP/native-build-prefix.txt")" = "$RUNNER_TEMP"
          /opt/nmcp-pg17-ci/bin/postgres --version | grep -F '17.7'
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-backup-root-cleanup
          go test -c -o "$RUNNER_TEMP/backup-live.test" ./internal/admin
          "$RUNNER_TEMP/backup-live.test" -test.list '^TestBackupPG17LiveCutover$' | grep -Fx TestBackupPG17LiveCutover
      - name: Actual backup restore cutover live-pool and resume proof
        shell: bash
        run: |
          set -euo pipefail
          sudo env -i PATH=/usr/bin:/bin HOME=/root LC_ALL=C \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            TEST_BACKUP_LIVE_SYSTEMD=1 \
            TEST_BACKUP_CANDIDATE_SHA="${{ github.sha }}" \
            TEST_BACKUP_PG17_BINDIR=/opt/nmcp-pg17-ci/bin \
            TEST_BACKUP_NATIVE_PREFIX="$RUNNER_TEMP/still-toolchain" \
            TEST_BACKUP_STILL_HELPER="$RUNNER_TEMP/still-helper-build/bin/nmcp-still-helper" \
            TEST_BACKUP_ANIMATION_HELPER="$RUNNER_TEMP/animation-helper-build/bin/nmcp-animation-helper" \
            TEST_BACKUP_ICC_PATH="$RUNNER_TEMP/sRGB2014.icc" \
            TEST_BACKUP_MEDIA_FIXTURE="$RUNNER_TEMP/orientation-6.jpg" \
            TEST_BACKUP_CORE_API="$RUNNER_TEMP/backup-live-binaries/core-api" \
            TEST_BACKUP_CORE_WORKER="$RUNNER_TEMP/backup-live-binaries/core-worker" \
            TEST_BACKUP_ADMIN_BINARY="$RUNNER_TEMP/backup-live-binaries/nmcp-admin" \
            bash scripts/run-backup-root-isolated "$RUNNER_TEMP/backup-live.test" -test.v -test.count=1 -test.timeout=18m \
            -test.run '^TestBackupPG17LiveCutover$' | tee "$RUNNER_TEMP/backup-live-cutover.log"
          grep -F -- '--- PASS: TestBackupPG17LiveCutover ' "$RUNNER_TEMP/backup-live-cutover.log"
          ! grep -F -- '--- SKIP: TestBackupPG17LiveCutover' "$RUNNER_TEMP/backup-live-cutover.log"
      - name: Always stop only receipt-owned isolated machine
        if: always()
        shell: bash
        run: |
          sudo env -i PATH=/usr/bin:/bin HOME=/root LC_ALL=C \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            TEST_BACKUP_CANDIDATE_SHA="${{ github.sha }}" \
            bash scripts/run-backup-root-isolated --cleanup live

