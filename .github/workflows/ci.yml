name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nmcp
          POSTGRES_PASSWORD: nmcp-test-password
          POSTGRES_DB: nmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmcp -d nmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://nmcp:nmcp-test-password@127.0.0.1:5432/nmcp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install metadata probe tools
        run: |
          mkdir -p .tools
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends util-linux xz-utils
          curl --fail --location --silent --show-error \
            https://github.com/exiftool/exiftool/archive/refs/tags/13.36.tar.gz \
            --output .tools/exiftool-13.36.tar.gz
          curl --fail --location --silent --show-error \
            https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-6.0.1-amd64-static.tar.xz \
            --output .tools/ffmpeg-6.0.1-amd64-static.tar.xz
          printf '%s  %s\n' \
            f70ecbcdccc18268d4d3c290faf8cf73b1cf128e3e7f8671e24d6604cae4dc73 .tools/exiftool-13.36.tar.gz \
            28268bf402f1083833ea269331587f60a242848880073be8016501d864bd07a5 .tools/ffmpeg-6.0.1-amd64-static.tar.xz | sha256sum --check
          tar -xzf .tools/exiftool-13.36.tar.gz -C .tools
          tar -xJf .tools/ffmpeg-6.0.1-amd64-static.tar.xz -C .tools
          .tools/exiftool-13.36/exiftool -ver
          .tools/ffmpeg-6.0.1-amd64-static/ffprobe -version
          prlimit --version
      - name: Build native still-image helper smoke target
        run: |
          sudo apt-get install -y --no-install-recommends \
            autoconf automake cmake libtool make meson nasm ninja-build pkg-config \
            libglib2.0-dev libjpeg-turbo8-dev libpng-dev libwebp-dev libexif-dev \
            libde265-dev zlib1g-dev
          curl --fail --location --silent --show-error \
            https://registry.color.org/rgb-registry/profiles/sRGB2014.icc \
            --output "${RUNNER_TEMP}/sRGB2014.icc"
          printf '%s  %s\n' \
            384b832de3412066743b52a75ee906b6fb9fb8d9e09e936fc2c43223815c6e0a \
            "${RUNNER_TEMP}/sRGB2014.icc" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://www.gstatic.com/webp/gallery/4.webp \
            --output "${RUNNER_TEMP}/static-gallery-4.webp"
          printf '%s  %s\n' \
            0858d0afcb2921ded36b05586204f2459d965feb7db54cb083e3cfa059589dd9 \
            "${RUNNER_TEMP}/static-gallery-4.webp" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/recurser/exif-orientation-examples/219294e144531b0c01247913cb58b6f5531b5081/Landscape_6.jpg \
            --output "${RUNNER_TEMP}/orientation-6.jpg"
          printf '%s  %s\n' \
            9b344e9f0c869d8637ea22e672df9451d8d3cc1d2d0b291af3b284e538e5f124 \
            "${RUNNER_TEMP}/orientation-6.jpg" | sha256sum --check
          curl --fail --location --silent --show-error \
            'https://raw.pixls.us/data/Canon/Canon%20PowerShot%20A410/CANON_A410_CHDK_CRW_0741.DNG' \
            --output "${RUNNER_TEMP}/canon-a410.dng"
          printf '%s  %s\n' \
            f0d2fe47507fadf50008bddbc6bd2c5e39fddbe90cca6bca72dd360fa0e0eb38 \
            "${RUNNER_TEMP}/canon-a410.dng" | sha256sum --check
          chmod +x internal/stillprocessor/helper/build-pinned-toolchain.sh
          internal/stillprocessor/helper/build-pinned-toolchain.sh \
            "${RUNNER_TEMP}/still-toolchain" "${RUNNER_TEMP}/still-toolchain-work"
          heic_fixture="${RUNNER_TEMP}/still-toolchain-work/source/libheif-1.23.5/examples/example.heic"
          printf '%s  %s\n' \
            7f8b363e4936c0666a25f64f3a92fda10bd8e5453be4592530b65a55dd98f3f2 \
            "${heic_fixture}" | sha256sum --check
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/still-toolchain/lib/pkgconfig:${RUNNER_TEMP}/still-toolchain/lib64/pkgconfig"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64"
          cmake -S internal/stillprocessor/helper \
            -B "${RUNNER_TEMP}/still-helper-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/still-toolchain"
          cmake --build "${RUNNER_TEMP}/still-helper-build" --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/still-helper-build" --output-on-failure
          "${RUNNER_TEMP}/still-helper-build/bin/nmcp-heif-fixture-generator" \
            "${RUNNER_TEMP}/generated-heif-fixtures" "${RUNNER_TEMP}/sRGB2014.icc"
          capabilities=$("${RUNNER_TEMP}/still-helper-build/bin/nmcp-still-helper" \
            capabilities --protocol 1 --threads 1 \
            --srgb-icc "${RUNNER_TEMP}/sRGB2014.icc")
          printf '%s\n' "${capabilities}"
          CAPABILITIES="${capabilities}" python3 -c \
            'import json,os; v=json.loads(os.environ["CAPABILITIES"])["result"]["library_versions"]; assert v["libvips"]=="8.18.7" and v["libheif"]=="1.23.5" and v["libraw"]=="0.22.2-Release" and v["libaom"]=="v3.8.2" and v["lcms2"]=="2.14", v'
          printf 'TEST_STILL_HELPER_PATH=%s\nTEST_STILL_RAW_REFERENCE_PATH=%s\nTEST_STILL_AVIF_REFERENCE_PATH=%s\nTEST_STILL_ICC_PATH=%s\nTEST_STILL_P3_ICC_PATH=%s\nTEST_STILL_HEIC_PATH=%s\nTEST_STILL_WEBP_PATH=%s\nTEST_STILL_ORIENTATION6_PATH=%s\nTEST_STILL_RAW_PATH=%s\nTEST_STILL_PQ_PATH=%s\nTEST_STILL_HLG_PATH=%s\nTEST_STILL_ICC_NCLX_PATH=%s\nTEST_STILL_INVALID_ICC_PATH=%s\nTEST_STILL_HEIF_COLLECTION_PATH=%s\n' \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-still-helper" \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-raw-reference" \
            "${RUNNER_TEMP}/still-helper-build/bin/nmcp-avif-reference" \
            "${RUNNER_TEMP}/sRGB2014.icc" \
            "${RUNNER_TEMP}/generated-heif-fixtures/display-p3.icc" "${heic_fixture}" \
            "${RUNNER_TEMP}/static-gallery-4.webp" \
            "${RUNNER_TEMP}/orientation-6.jpg" \
            "${RUNNER_TEMP}/canon-a410.dng" \
            "${RUNNER_TEMP}/generated-heif-fixtures/pq.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/hlg.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/icc-nclx.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/invalid-icc.avif" \
            "${RUNNER_TEMP}/generated-heif-fixtures/collection-primary-second.avif" >> "${GITHUB_ENV}"
          printf 'LD_LIBRARY_PATH=%s\n' \
            "${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64" >> "${GITHUB_ENV}"
      - name: Build pinned native animation helper and fixtures
        run: |
          chmod +x internal/animationprocessor/helper/build-pinned-codecs.sh
          internal/animationprocessor/helper/build-pinned-codecs.sh \
            "${RUNNER_TEMP}/still-toolchain" "${RUNNER_TEMP}/animation-toolchain-work"
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/still-toolchain/lib/pkgconfig:${RUNNER_TEMP}/still-toolchain/lib64/pkgconfig"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/still-toolchain/lib:${RUNNER_TEMP}/still-toolchain/lib64"
          cmake -S internal/animationprocessor/helper \
            -B "${RUNNER_TEMP}/animation-helper-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/still-toolchain"
          cmake --build "${RUNNER_TEMP}/animation-helper-build" --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/animation-helper-build" --output-on-failure
          "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-fixture-generator" \
            "${RUNNER_TEMP}/animation-variable.webp"
          capabilities=$("${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-helper" \
            capabilities --protocol 1 --threads 1 \
            --srgb-icc "${RUNNER_TEMP}/sRGB2014.icc")
          printf '%s\n' "${capabilities}"
          CAPABILITIES="${capabilities}" python3 -c \
            'import json,os; v=json.loads(os.environ["CAPABILITIES"])["result"]["library_versions"]; assert v["libwebp"]=="1.6.0" and v["giflib"]=="5.2.2" and v["libheif"]=="1.23.5" and v["libaom"]=="v3.8.2" and v["lcms2"]=="2.14", v'
          printf 'TEST_ANIMATION_HELPER_PATH=%s\nTEST_ANIMATION_WEBP_PATH=%s\nTEST_ANIMATION_WEBP_REFERENCE_PATH=%s\n' \
            "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-animation-helper" \
            "${RUNNER_TEMP}/animation-variable.webp" \
            "${RUNNER_TEMP}/animation-helper-build/bin/nmcp-webp-reference" >> "${GITHUB_ENV}"
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build all three Core binaries
        run: go build ./cmd/core-api ./cmd/core-worker ./cmd/nmcp-admin
      - name: Unit and local integration tests
        run: go test -count=1 ./...
      - name: Explicit profile schema and bundled recipe evidence
        run: go test -v -count=1 ./internal/profile
      - name: Explicit metadata detector and real probe evidence
        env:
          TEST_METADATA_TOOLS: "1"
          TEST_EXIFTOOL_PATH: ${{ github.workspace }}/.tools/exiftool-13.36/exiftool
          TEST_FFPROBE_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe
          TEST_FFMPEG_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg
        run: go test -v -count=1 ./internal/mediaformat ./internal/metadata
      - name: Explicit native still codec evidence
        env:
          TEST_STILL_HELPER: "1"
          TEST_FFPROBE_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffprobe
          TEST_FFMPEG_PATH: ${{ github.workspace }}/.tools/ffmpeg-6.0.1-amd64-static/ffmpeg
        run: go test -v -count=1 ./internal/stillprocessor
      - name: Explicit native animation codec evidence
        env:
          TEST_ANIMATION_HELPER: "1"
        run: go test -v -count=1 ./internal/animationprocessor
      - name: Explicit Linux storage durability evidence
        run: go test -v -count=1 ./internal/storage
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Explicit PostgreSQL migration integration evidence
        run: go test -v -count=1 -run '^TestMigratorIntegration$' ./internal/database
      - name: Explicit job lease, Worker, and process supervision evidence
        run: go test -v -count=1 ./internal/job ./internal/worker ./internal/processrunner
      - name: Explicit upload PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestRepositoryIntegration' ./internal/upload
      - name: Explicit read PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestReadServiceIntegration$' ./internal/readapi
      - name: Explicit read HTTP and PostgreSQL integration evidence
        run: go test -v -count=1 -run '^TestReadHTTPPostgreSQLIntegration$' ./internal/httpapi
