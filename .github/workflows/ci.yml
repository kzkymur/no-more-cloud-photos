name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nmcp
          POSTGRES_PASSWORD: nmcp-test-password
          POSTGRES_DB: nmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmcp -d nmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://nmcp:nmcp-test-password@127.0.0.1:5432/nmcp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build all three Core binaries
        run: go build ./cmd/core-api ./cmd/core-worker ./cmd/nmcp-admin
      - name: Unit and local integration tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Explicit PostgreSQL migration integration evidence
        run: go test -v -count=1 -run '^TestMigratorIntegration$' ./internal/database
