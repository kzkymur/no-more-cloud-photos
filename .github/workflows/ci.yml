name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && format('push-{0}', github.ref_name) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Run quick validation
        run: scripts/run-validation quick

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nmcp
          POSTGRES_PASSWORD: nmcp-test-password
          POSTGRES_DB: nmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmcp -d nmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://nmcp:nmcp-test-password@127.0.0.1:5432/nmcp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Run real PostgreSQL validation
        run: scripts/run-validation postgres

  native-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nmcp
          POSTGRES_PASSWORD: nmcp-test-password
          POSTGRES_DB: nmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nmcp -d nmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://nmcp:nmcp-test-password@127.0.0.1:5432/nmcp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Restore pinned native source downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/*.tar.gz
            .tools/*.tar.xz
            .native-work/**/downloads
            .native-work/downloads
          key: native-sources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('internal/**/helper/build-pinned-*.sh', 'scripts/prepare-native-validation') }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake cmake libtool make meson nasm ninja-build pkg-config \
            libglib2.0-dev libjpeg-turbo8-dev libpng-dev libwebp-dev libexif-dev \
            libde265-dev util-linux xz-utils zlib1g-dev
      - name: Prepare native evidence and run full race coverage
        run: scripts/prepare-native-validation scripts/run-validation native-race

  full-gate:
    if: always()
    needs: [quick, postgres, native-race]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        env:
          QUICK: ${{ needs.quick.result }}
          POSTGRES: ${{ needs.postgres.result }}
          NATIVE_RACE: ${{ needs.native-race.result }}
        run: |
          for result in "$QUICK" "$POSTGRES" "$NATIVE_RACE"; do
            test "$result" = success
          done
