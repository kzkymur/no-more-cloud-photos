name: Infra validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record container runtime versions
        run: |
          docker version
          docker compose version
      - name: Build and verify isolated Core environment
        run: scripts/validation-env verify
      - name: Always remove validation resources
        if: always()
        run: scripts/validation-env reset
