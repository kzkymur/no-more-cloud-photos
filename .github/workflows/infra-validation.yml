name: Infra validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.event_name == 'push' && format('push-{0}', github.ref_name) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record container runtime versions
        run: |
          docker version
          docker compose version
      - name: Build and verify isolated Core environment
        run: scripts/run-validation infra
      - name: Always remove validation resources
        if: always()
        run: scripts/validation-env reset
