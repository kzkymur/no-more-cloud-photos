name: Infra validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Record container runtime versions
        run: |
          docker version
          docker compose version
      - name: Build and verify isolated Core environment
        run: scripts/validation-env verify
      - name: Always remove validation resources
        if: always()
        run: scripts/validation-env reset

  # Issue #21 Compose E2E lane. The harness self-test always runs; the
  # engineer-owned scenario (./test/e2e) runs on the same image once it exists.
  # Only the scenario run is #21 evidence. The self-test proves the hook
  # contract alone.
  compose-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Lint harness scripts
        run: shellcheck scripts/infra-e2e-env infra/validation/e2e-selftest.sh
      - name: Harness self-test (contract only, not #21 acceptance)
        env:
          NMCP_E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-results/selftest
          NMCP_E2E_TIMEOUT_SECONDS: "600"
        run: scripts/infra-e2e-env lane -- infra/validation/e2e-selftest.sh
      - name: Build #21 scenario
        id: scenario
        run: |
          if [ ! -d test/e2e ]; then
            echo "::notice title=#21 scenario absent::./test/e2e does not exist yet; only the harness self-test ran. This run is NOT #21 acceptance."
            echo "present=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          go test -c -o "$RUNNER_TEMP/nmcp-e2e.test" ./test/e2e
          echo "present=true" >>"$GITHUB_OUTPUT"
      - name: Run #21 scenario
        if: steps.scenario.outputs.present == 'true'
        env:
          NMCP_E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-results/scenario
          NMCP_E2E_TIMEOUT_SECONDS: "1260"
        run: >-
          scripts/infra-e2e-env lane --
          "$RUNNER_TEMP/nmcp-e2e.test" -test.v -test.count=1 -test.timeout=20m
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-results
          retention-days: 14
          if-no-files-found: warn
      - name: Always remove E2E resources
        if: always()
        run: scripts/infra-e2e-env reset
