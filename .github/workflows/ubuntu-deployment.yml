name: Ubuntu deployment

on:
  pull_request:
    paths:
      - ".github/workflows/ubuntu-deployment.yml"
      - "docs/local-validation.md"
      - "docs/ubuntu-deployment.md"
      - "infra/ubuntu/**"
      - "infra/postgresql/**"
      - "cmd/nmcp-admin/**"
      - "internal/database/**"
      - "go.mod"
      - "go.sum"
      # Deliberately conservative: changes to shared validation dispatch or any
      # deployment verifier must never bypass the privileged gate.
      - "scripts/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-deployment-${{ github.event_name == 'push' && format('push-{0}', github.ref_name) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache: true
      - name: Install parser and HTTP test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libimage-exiftool-perl nginx-core postgresql shellcheck
      - name: Run privileged Ubuntu validation
        run: scripts/run-validation ubuntu
