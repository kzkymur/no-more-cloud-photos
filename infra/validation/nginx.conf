user nmcp;
worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    default_type application/octet-stream;
    types {
        image/avif avif;
        image/bmp bmp;
        image/dng dng;
        image/gif gif;
        image/heic heic;
        image/heif heif;
        image/jpeg jpg;
        image/png png;
        image/webp webp;
        image/x-canon-cr2 cr2;
        image/x-canon-cr3 cr3;
        image/x-fuji-raf raf;
        image/x-nikon-nef nef;
        image/x-olympus-orf orf;
        image/x-panasonic-rw2 rw2;
        image/x-sony-arw arw;
        video/mp4 mp4;
        video/quicktime mov;
    }
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /tmp/nmcp-tls/cert.pem;
        ssl_certificate_key /tmp/nmcp-tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        location = /files-healthz {
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        location ~ "^/files/originals/(?<original_path>[0-9a-f]{2}/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/original[.](?:arw|bmp|cr2|cr3|dng|gif|heic|heif|jpg|mov|mp4|nef|orf|png|raf|rw2|webp))$" {
            alias /var/lib/nmcp/media/originals/$original_path;
            autoindex off;
            disable_symlinks on from=/var/lib/nmcp/media;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ~ "^/files/renditions/(?<rendition_path>[0-9a-f]{2}/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}[.](?:avif|mp4|webp))$" {
            alias /var/lib/nmcp/media/renditions/$rendition_path;
            autoindex off;
            disable_symlinks on from=/var/lib/nmcp/media;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "private, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            return 404;
        }
    }
}
